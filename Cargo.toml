[package]
name = "bilibili-dynamic-arona-plugin"
version = "0.1.3"
edition = "2024"
license = "AGPL-3.0-only"
description = "B 站动态/直播订阅推送插件：插入 Arona-rs 框架运行，命令与配置不依赖任何前置插件"

# 本包是独立仓库的根，不被任何 workspace 收养
[workspace]

[lib]
# cdylib 产出框架启动时扫描 plugins/ 装载的 bilibili_dynamic_plugin.dll；
# rlib 那份只给 `cargo test` 用。宿主永远不链接本 crate。
name = "bilibili_dynamic_plugin"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 框架仓与本插件仓同在 G:\rustprojects 下，所以写得成相对路径——整仓挪盘时这一行不用跟着改。
# 发版时要换成 git 标签或 crates.io，见框架仓库 PLUGIN_DEVELOPMENT.md §16：
#   arona = { package = "arona-rs", git = "https://github.com/YuLinLoli/Arona-rs", tag = "v1.1.0", default-features = false }
# default-features = false 是硬要求：gui 由宿主决定，插件带上会把 eframe/wgpu 整条链拖进 dll。
arona = { package = "arona-rs", path = "../Arona-rs/crates/arona", version = "1.1.0", default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
percent-encoding = "2"
# 出站 HTTP 走 arona::runtime::http（宿主那份客户端代发），本 crate 不链接 reqwest
# 动态流的 WBI 签名要 MD5，只用来算 w_rid，不涉及任何安全用途
md5 = "0.7"
# 动态链接二维码：只要点阵，画成像素由本插件的 draw::qr 负责
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 字形栅格化不在这里：字面那一层（ab_glyph + 有界字形缓存）收在框架的 arona::runtime::text，
# 三个出图插件共用那一份实现，见 PLUGIN_DEVELOPMENT.md §7
rand = "0.8"
once_cell = "1"
log = "0.4"

[dev-dependencies]
# 联网用例需要直连一次 B 站（#[ignore]，默认不跑），走的是框架的 http 出口，不必额外依赖

[profile.release]
opt-level = 2
